<!doctype html>
<html lang="en" data-nook-ui><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="studio.css"><title>Custom workspace</title></head>
<body><main>
<header><span class="eyebrow">YOUR OWN INTERFACE</span><span class="pill">SDK custom view</span></header>
<section class="hero"><div><p id="modeLabel">Focus</p><h1 id="title">My workspace</h1><p class="description">A plugin-designed canvas. Your layout, your controls, your experience.</p></div><div class="orbit" aria-hidden="true"><span>✦</span></div></section>
<section class="controls"><label>Workspace mode<select id="mode"><option>Focus</option><option>Review</option></select></label><label>Workspace name<input id="name" maxlength="60" value="My workspace"></label><button id="rename">Apply name</button></section>
<footer><span id="status" role="status">Ready · local demo only</span><button id="window">Open native window ↗</button></footer>
</main><script src="studio.js"></script></body></html>
